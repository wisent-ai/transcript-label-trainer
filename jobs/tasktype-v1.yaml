# The end-to-end story of this repository, as an actual job.
#
#   transcript-label-trainer autolabel --aspect tasktype \
#     --values bugfix,feature,chore,question --limit 40
#   transcript-label-trainer run jobs/tasktype-v1.yaml
#   transcript-label-trainer evaluate tasktype-v1
#
# The teacher routed through Brama produced the ground truth, so the evaluator
# names that exact provenance: manual labels, model suggestions and a different
# teacher are all excluded from training by this one field.
name: tasktype-v1
task: classify what kind of work the session did
evaluator: brama:codex/gpt-5.6-sol
model: tfidf-logreg
scope:
  aspect: tasktype
# The holdout share (between 0 and 1) and seed are the operator's to state;
# `run` refuses this job until they are filled in. A job that already ran keeps
# the frozen split in $TLT_HOME/models/tasktype-v1/eval-split.json, whose
# fraction and seed are the values to write here.
eval_split:
  fraction:
  seed:
# The tfidf-logreg settings: scikit-learn's documented defaults, each value
# and its document listed in docs/guide/training.md.
training: scikit-learn
