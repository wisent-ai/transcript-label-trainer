# Example training job for transcript-label-trainer.
#
# A job spec answers four questions about a training run:
#   WHO evaluated the transcripts  -> evaluator (the exact label-store source
#                                     that counts as ground truth)
#   WHICH model to train           -> model ("tfidf-logreg" for the sklearn
#                                     backend, any other string is a
#                                     HuggingFace model id and needs the
#                                     'hf' cargo feature)
#   the SCOPE of training data     -> scope (aspect plus optional filters)
#   the TASK                       -> task (free text stored with the artifacts)
#
# eval_split is required and has no default: state the holdout share and seed
# (or `eval_split: false`). Training needs two distinct values on the training
# side and no session count. judge is on unless the spec says `judge: false`.
# training is required too: tfidf-logreg states ngram_max, lowercase,
# sublinear_tf, smooth_idf, min_df, max_df, c, max_iter, tol, lbfgs_memory,
# armijo_c1 and max_backtracks, or names a preset that states them all with
# vendor citations (scikit-learn); a HuggingFace model states epochs,
# batch_size, learning_rate, max_length, seed, weight_decay, max_grad_norm and
# in_training_eval_share.
#
# Run it with:  transcript-label-trainer run jobs/example-topic.yaml
# Run it on a Stado target with:
#   transcript-label-trainer run jobs/example-topic.yaml \
#     --compute-target ubuntu-server-rtx-pro-6000
# Artifacts land in <training root>/models/<name>/.

name: topic-v1
task: classify the primary topic of the session
evaluator: manual
model: tfidf-logreg
scope:
  aspect: topic
  # Optional filters, all unset here so the job trains on everything the
  # evaluator labeled:
  # runtimes: [claude, codex, kimi]   # only these runtimes
  # since: "2026-07-01"               # only labels recorded on/after this date
  # values: [bugfix, feature, chore]  # only these label values
  # min_text_chars: 200               # skip sessions with shorter text

# The frozen evaluation split. The holdout is chosen once from the fraction
# (between 0 and 1) and seed stated here, written to
# $TLT_HOME/models/topic-v1/eval-split.json, and reused by every later run of
# this job: sessions labeled later can only join the training side, and
# nothing in the file is ever trained on. Both fields are yours to state; the
# trainer chooses neither and refuses this file until they are filled in. Use
# `eval_split: false` to train on every labeled session instead — then there
# is nothing for `evaluate` to score.
eval_split:
  fraction:
  seed:

# The Brama teacher that `transcript-label-trainer evaluate topic-v1` asks
# whether the model's holdout predictions are acceptable. On by default;
# `judge: false` skips the verdict. `evaluate topic-v1 --best` then uses
# Brama's `-best` route to audit both these labels and the teacher's opinions.
# All inference goes through Brama.
judge:
  model: best

# The tfidf-logreg settings: scikit-learn's documented defaults for
# TfidfVectorizer and LogisticRegression(solver="lbfgs"), with SciPy's
# L-BFGS-B memory and Armijo constant. Each value and its document are listed
# in docs/guide/training.md; metrics.json records them.
training: scikit-learn
