name: Create Hugging Face goal-model repository

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create private model repository
        env:
          HF_TOKEN: ${{ secrets.HF_PUBLISH_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          token = os.environ["HF_TOKEN"]
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          identity_request = Request("https://huggingface.co/api/whoami-v2", headers=headers)
          with urlopen(identity_request, timeout=60) as response:
              identity = json.load(response)
          organizations = {organization["name"] for organization in identity.get("orgs", [])}
          if "wisent-ai" not in organizations:
              raise SystemExit("token owner is not a member of wisent-ai")

          request = Request(
              "https://huggingface.co/api/repos/create",
              data=json.dumps({
                  "name": "jeden-goal-qwen3-4b",
                  "organization": "wisent-ai",
                  "type": "model",
                  "private": True,
              }).encode(),
              headers=headers,
              method="POST",
          )
          try:
              with urlopen(request, timeout=60) as response:
                  result = json.load(response)
          except HTTPError as error:
              if error.code != 409:
                  raise
              result = {"url": "https://huggingface.co/wisent-ai/jeden-goal-qwen3-4b", "status": "exists"}
          print(json.dumps(result, sort_keys=True))
          PY
