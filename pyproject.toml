[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transcript-label-trainer"
version = "0.1.0"
description = "Trains small local classifiers that predict Transcript Lake aspect labels and emits label suggestions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
hf = [
    "torch>=2.2",
    "transformers>=4.40",
    "accelerate>=1.1",
]

[project.scripts]
transcript-label-trainer = "transcript_label_trainer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/transcript_label_trainer"]
